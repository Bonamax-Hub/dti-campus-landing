name: Publish landing page

# On every change to the repository, by hand (Run workflow), and every 15 minutes to pick up
# ticker changes made in the SharePoint "Landing Updates" list.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Entra trusts this environment's runs (federated credential), so keep the name.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read ticker items from SharePoint
        env:
          M365_TENANT_ID: ${{ vars.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ vars.M365_CLIENT_ID }}
        run: node scripts/sync-updates.mjs

      # A broken ticker file stops here, so the live page keeps its last good version.
      - name: Check the ticker
        run: node scripts/check-updates.mjs

      # Keeps a record of every public ticker change, plus a monthly heartbeat: GitHub pauses
      # scheduled jobs in repositories with no activity for 60 days.
      - name: Save changes
        id: save
        run: |
          date -u +%Y-%m > .github/heartbeat
          git add -N .github/heartbeat
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/updates.json .github/heartbeat
            git commit -m "Update landing page ticker from SharePoint"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Pages
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deploy
        if: github.event_name != 'schedule' || steps.save.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
